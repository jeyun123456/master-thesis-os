name: Android companion APK (feature branch only)
on:
  push:
    branches:
      - feature/android-companion-v1
    paths:
      - experiments/android-home-poc/**
      - .github/workflows/android-companion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile signed debug APK
        run: gradle -p experiments/android-home-poc :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chocomint-Lab-Galaxy-debug
          path: experiments/android-home-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error