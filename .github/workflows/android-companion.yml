name: Android companion APK
on:
  push:
    branches:
      - feature/android-companion-v1
    paths:
      - experiments/android-home-poc/**
      - .github/workflows/android-companion.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile signed debug APK
        run: gradle -p experiments/android-home-poc :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Chocomint-Lab-Galaxy-debug
          path: experiments/android-home-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sign-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build release APK with the existing signing key
        shell: bash
        env:
          CHOCOMINT_BASE_URL: https://master-thesis-os.vercel.app
          RELEASE_KEYSTORE_BASE64: ${{ secrets.CHOCOMINT_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.CHOCOMINT_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.CHOCOMINT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          client_id="$(curl -fsSL --max-time 15 "$CHOCOMINT_BASE_URL/api/p0/session" | jq -r '.googleClientId // empty')"
          if [[ ! "$client_id" =~ ^[A-Za-z0-9._-]+\.apps\.googleusercontent\.com$ ]]; then
            echo "Production Google client ID unavailable" >&2
            exit 1
          fi
          store="$RUNNER_TEMP/chocomint-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$store"
          {
            printf 'chocomint.baseUrl=%s\n' "$CHOCOMINT_BASE_URL"
            printf 'chocomint.googleWebClientId=%s\n' "$client_id"
            printf 'chocomint.keystore=%s\n' "$store"
            printf 'chocomint.keystorePassword=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'chocomint.keyAlias=chocomint\n'
            printf 'chocomint.keyPassword=%s\n' "$RELEASE_KEY_PASSWORD"
          } >> experiments/android-home-poc/gradle.properties
          gradle -p experiments/android-home-poc :app:assembleRelease --no-daemon
          mkdir -p experiments/android-home-poc/release-output
          output="experiments/android-home-poc/release-output/Chocomint-Lab-Galaxy-v1.0.0.apk"
          cp experiments/android-home-poc/app/build/outputs/apk/release/app-release.apk "$output"
          # SHA-1 of the signing certificate that Google OAuth is registered for; a different key would break sign-in and updates.
          expected_sha1="fe79133f02e71b2b7905796a2e0c06afc8aefe86"
          signer_output="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$output")"
          actual_sha1="$(printf '%s\n' "$signer_output" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p')"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "Signing certificate SHA-1 mismatch; refusing to publish this APK." >&2
            exit 1
          fi
          (cd experiments/android-home-poc/release-output && sha256sum Chocomint-Lab-Galaxy-v1.0.0.apk > Chocomint-Lab-Galaxy-v1.0.0.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: Chocomint-Lab-Galaxy-v1.0.0-release
          path: experiments/android-home-poc/release-output/*
          if-no-files-found: error
          retention-days: 30
